name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: gpis_test
          POSTGRES_USER: gpis
          POSTGRES_PASSWORD: gpis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpis -d gpis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GPIS_TEST_DATABASE_URL: postgresql+psycopg://gpis:gpis@localhost:5432/gpis_test
      GPIS_PUNJAB_TEST_DATABASE_URL: postgresql+psycopg://gpis:gpis@localhost:5432/gpis_punjab_test
      GPIS_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: pip install -e ".[dev,ingestion]"
      - name: Cache reviewed source files
        uses: actions/cache@v4
        with:
          path: data/raw
          key: official-documents-${{ hashFiles('data/curated/document_sources.json', 'data/curated/pbs_table_1.json') }}
      - name: Verify official test inputs
        run: python -m scripts.fetch_test_sources
      - name: Run tests
        env:
          PGPASSWORD: gpis
        run: |
          psql -h localhost -U gpis -d gpis_test -c 'CREATE DATABASE gpis_punjab_test'
          pytest -q
      - name: Verify packaged source previews
        run: python -m app.history
      - name: Run RAG evaluation
        run: python scripts/run_rag_evaluation.py --enforce
      - name: Check Markdown links
        run: python scripts/check_markdown_links.py
