services:
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: gpis
      POSTGRES_USER: gpis
      POSTGRES_PASSWORD: gpis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpis -d gpis"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - gpis_postgres:/var/lib/postgresql/data

  api:
    build: .
    environment:
      GPIS_ENV: development
      GPIS_DATABASE_URL: postgresql+psycopg://gpis:gpis@database:5432/gpis
      GPIS_REPOSITORY: postgres
      GPIS_SCORE_VERSION: prototype-v1
      GPIS_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      GPIS_SEMANTIC_THRESHOLD: "0.35"
      GPIS_SESSION_TTL_HOURS: ${GPIS_SESSION_TTL_HOURS:-24}
      GPIS_REDIS_URL: redis://redis:6379/0
      GPIS_RETRIEVAL_CACHE_TTL_SECONDS: ${GPIS_RETRIEVAL_CACHE_TTL_SECONDS:-900}
      GPIS_EMBEDDING_CACHE_TTL_SECONDS: ${GPIS_EMBEDDING_CACHE_TTL_SECONDS:-86400}
      LANGGRAPH_STRICT_MSGPACK: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      PHOENIX_ENABLED: ${PHOENIX_ENABLED:-false}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-gpis-local}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/models/huggingface

  phoenix:
    image: arizephoenix/phoenix:latest
    profiles: ["observability"]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "6006:6006"
      - "4317:4317"
    volumes:
      - phoenix_data:/mnt/data

volumes:
  gpis_postgres:
  huggingface_cache:
  phoenix_data:
